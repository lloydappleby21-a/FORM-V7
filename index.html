// ---------- derived ----------

// ---------- body weight units ----------
const LBKG=0.45359237;
const bwLegacy=st=>(st&&st.legacyWU)||((st&&st.unit)==="lb"?"lb":"kg");
const bwKg=(r,st)=>{if(!r||r.weight==null||r.weight==="")return null;const v=+r.weight;if(!v)return null;return r.wu==="kg"?v:(bwLegacy(st||S.settings)==="lb"?v*LBKG:v);};
const bwU=st=>{st=st||S.settings||{};return st.bwUnit||(st.unit==="lb"?"lb":"kg");};

const bwDelta=(dk,u)=>{const v=(u||bwU())==="kg"?dk:dk/LBKG;return (v>0?"▲ +":"▼ ")+r1(Math.abs(v))+" "+((u||bwU())==="kg"?"kg":"lb");};
const BWU=[["kg","kg"],["lb","lb"],["st","st & lb"]];
function bwInput(id,u,ph){u=u||bwU();const st=`min-height:36px;padding:6px 10px;min-width:0`;
  return u==="st"?`<div class="row" style="gap:6px;flex:1;min-width:0"><input id="${id}St" type="number" inputmode="numeric" placeholder="${ph&&ph.st!=null?ph.st:"st"}" aria-label="Weight, stone" style="${st};flex:1"><span class="muted small">st</span><input id="${id}Lb" type="number" inputmode="decimal" step="0.1" placeholder="${ph&&ph.lb!=null?ph.lb:"lb"}" aria-label="Weight, pounds" style="${st};flex:1"><span class="muted small">lb</span></div>`

function bwPh(kg,u){if(kg==null)return null;u=u||bwU();if(u!=="st")return {v:r1(bwNum(kg,u))};const lb=kg/LBKG;return {st:Math.floor(lb/14),lb:r1(lb-Math.floor(lb/14)*14)};}
function bwRead(id,u){u=u||bwU();const g=x=>{const e=document.getElementById(x);return e&&e.value!==""?+e.value:null;};
  if(u==="st"){const a=g(id+"St"),b=g(id+"Lb");if(a==null&&b==null)return null;const lb=(a||0)*14+(b||0);return lb>0?lb*LBKG:null;}
  const v=g(id);if(v==null||!(v>0))return null;return u==="kg"?v:v*LBKG;}
// weight trend chart (x = real dates, y in the chosen unit)
function bwChart(pts,u,label,goalKg){
  if(pts.length<2)return "";
  const W=360,H=180,pl=48,pr=12,pt=16,pb=26;
  const xs=pts.map(p=>parseYmd(p.date).getTime()),ys=pts.map(p=>bwNum(p.kg,u));
  const x0=Math.min(...xs),x1=Math.max(...xs),span=Math.max(1,x1-x0);
  const step=u==="kg"?0.5:u==="lb"?1:1/14;
  const gy=goalKg?bwNum(goalKg,u):null;let lo=Math.min(...ys,...(gy!=null?[gy]:[])),hi=Math.max(...ys,...(gy!=null?[gy]:[]));const pad=Math.max((hi-lo)*0.15,step*2);lo-=pad;hi+=pad;
  const X=t=>pl+(W-pl-pr)*((t-x0)/span),Y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo||1));
  const lab=v=>u==="st"?stlb(v*14).replace(" lb",""):r1(v);
  const ticks=[lo+(hi-lo)*0.1,(lo+hi)/2,hi-(hi-lo)*0.1];
  const P=pts.map((p,i)=>[X(xs[i]),Y(ys[i])]);
  const line=P.map(q=>q[0].toFixed(1)+","+q[1].toFixed(1)).join(" ");
  const area=`M${P[0][0].toFixed(1)},${(H-pb)} L${line.replace(/ /g," L")} L${P[P.length-1][0].toFixed(1)},${H-pb} Z`;
  // 7-day rolling average
  const avg=pts.map((p,i)=>{const t=xs[i],w=pts.filter((q,j)=>xs[j]<=t&&xs[j]>t-7*864e5);return [X(t),Y(sum(w,q=>bwNum(q.kg,u))/w.length)];});
  const dl=t=>new Date(t).toLocaleDateString("en-GB",{day:"numeric",month:"short"});
  const last=P[P.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label||"Weight trend")}">
    ${ticks.map(t=>`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"/><text x="${pl-6}" y="${(Y(t)+4).toFixed(1)}" text-anchor="end">${lab(t)}</text>`).join("")}
    <path class="area" d="${area}"/>
    ${gy!=null?`<line x1="${pl}" x2="${W-pr}" y1="${Y(gy).toFixed(1)}" y2="${Y(gy).toFixed(1)}" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="2 4"/><text x="${pl+4}" y="${(Y(gy)-5).toFixed(1)}" style="fill:var(--good);font-weight:600">Goal ${esc(bwFmt(goalKg,u))}</text>`:""}
    ${pts.length>=4?`<polyline points="${avg.map(q=>q[0].toFixed(1)+","+q[1].toFixed(1)).join(" ")}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4" opacity=".8"/>`:""}
    <polyline class="line" points="${line}"/>
    ${P.map((q,i)=>`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="${i===P.length-1?4.5:2.6}" fill="${i===P.length-1?"var(--accent)":"var(--fg)"}"><title>${esc(fmtDate(pts[i].date))}: ${esc(bwFmt(pts[i].kg,u))}</title></circle>`).join("")}
    <text x="${pl}" y="${H-8}">${dl(x0)}</text><text x="${W-pr}" y="${H-8}" text-anchor="end">${dl(x1)}</text>
    <text x="${Math.min(last[0],W-pr).toFixed(1)}" y="${Math.max(12,last[1]-10).toFixed(1)}" text-anchor="end" style="fill:var(--fg);font-weight:600">${esc(bwFmt(pts[pts.length-1].kg,u))}</text>
  </svg>${pts.length>=4?`<div class="muted small" style="margin-top:4px"><span style="color:var(--accent)">━</span> Weigh-ins &nbsp; <span>┅</span> 7-day average${gy!=null?` &nbsp; <span style="color:var(--good)">┈</span> Goal`:""}</div>`:(gy!=null?`<div class="muted small" style="margin-top:4px"><span style="color:var(--good)">┈</span> Goal</div>`:"")}`;
}
const bwPoints=(body,st)=>Object.entries(body||{}).map(([date,b])=>({date,kg:bwKg(b,st)})).filter(p=>p.kg!=null).sort((a,b)=>a.date.localeCompare(b.date));
// goal projection from the last 4 weeks of weigh-ins
function bwProj(pts,goalKg,u){
  if(!goalKg||!pts.length)return null;
  u=u||bwU();const last=pts[pts.length-1],left=goalKg-last.kg;
  const toGo=Math.abs(left)<0.25?null:(u==="kg"?r1(Math.abs(left))+" kg":r1(Math.abs(left)/LBKG)+" lb")+" to "+(left<0?"lose":"gain");
  if(!toGo)return {toGo:"Goal reached 🎉",txt:"You've hit your goal weight. Set a new one to keep going.",ok:true};
  const rec=pts.filter(p=>p.date>=addDays(last.date,-28));
  if(rec.length<2||parseYmd(last.date)-parseYmd(rec[0].date)<6*864e5)return {toGo,txt:"Log your weight a couple of times a week and I'll estimate when you'll reach it."};
  const x=rec.map(p=>(parseYmd(p.date)-parseYmd(rec[0].date))/864e5),y=rec.map(p=>p.kg),mx=sum(x,v=>v)/x.length,my=sum(y,v=>v)/y.length;
  let nu=0,de=0;x.forEach((v,i)=>{nu+=(v-mx)*(y[i]-my);de+=(v-mx)**2;});const slope=de?nu/de:0; // kg per day
  const wk=(u==="kg"?r1(Math.abs(slope*7))+" kg":r1(Math.abs(slope*7)/LBKG)+" lb")+"/wk";
  if(Math.abs(slope)<0.005)return {toGo,txt:"Your weight is steady at the moment, so there's no finish date yet."};
  if(Math.sign(slope)!==Math.sign(left))return {toGo,txt:`Your trend is moving away from your goal (${slope>0?"+":"−"}${wk}).`,warn:true};
  const days=left/slope;
  if(days>730)return {toGo,txt:`At ${wk} it will take over 2 years. A small calorie change would speed this up.`};
  const dt=parseYmd(addDays(ymd(),Math.round(days)));
  return {toGo,txt:`On track for ${dt.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:dt.getFullYear()!==new Date().getFullYear()?"numeric":undefined})} at ${wk}.`,ok:true};
}
function goalSheet(){
  const g=S.settings,u=bwU();
  openSheet(`<h2>Goal weight</h2><div class="muted small">Shown as a line on your weight graph, with an estimated date based on your last 4 weeks.</div>

    <div class="grid2">${g.goalKg?`<button class="btn danger" id="gwDel">Remove goal</button>`:`<span></span>`}<button class="btn primary" id="gwSave">Save goal</button></div>`);

  const d=$("#gwDel",sh);if(d)d.onclick=()=>{const n={...S.settings};delete n.goalKg;n.goalKg=null;save("settings","main",n);closeSheet();render();toast("Goal removed");};
}

const bodySorted=()=>Object.entries(S.body).map(([date,b])=>({date,...b})).sort((a,b)=>a.date.localeCompare(b.date));
// A set is recorded from what was typed in, not the tick box. Saved sets marked done:false (older unticked rows) are ignored.

// Mifflin-St Jeor + activity, then goal adjustment and macro split
function calcTargets(o){
  const w=o.kg,h=o.cm,a=o.age,male=o.sex==="m";
  const bmr=10*w+6.25*h-5*a+(male?5:o.sex==="f"?-161:-78);
  const tdee=bmr*o.act,bmi=w/((h/100)**2);
  let cal=tdee,note="";
  const safe=o.age<18||(bmi<18.5&&o.goal==="Lose fat");
  if(safe){note="Set to maintenance for safety.";}
  else if(o.goal==="Lose fat"){cal=tdee*(bmi>30?0.75:0.8);}
  else if(o.goal==="Gain muscle"){cal=tdee*1.1;}
  const floor=male?1500:o.sex==="f"?1200:1350;
  if(cal<floor){cal=floor;note=`Calories set to the safe minimum of ${floor} kcal.`;}
  cal=Math.round(cal/10)*10;
  const pkg=o.goal==="Lose fat"?2.0:o.goal==="Gain muscle"?1.8:1.6;
  const refW=bmi>30?(25*(h/100)**2):w;                       // protein from a healthy reference weight when BMI is high
  let protein=Math.round(Math.min(pkg*refW,cal*0.35/4)/5)*5;
  let fat=Math.round(Math.max(cal*0.25/9,0.6*w)/5)*5;
  let carbs=Math.max(0,Math.round((cal-protein*4-fat*9)/4/5)*5);
  return {cal,protein,carbs,fat,bmr:Math.round(bmr),tdee:Math.round(tdee),bmi:Math.round(bmi*10)/10,note};
}

function hist(name){const out=[];for(const w of workoutsSorted()){const ex=(w.exercises||[]).find(e=>e.name===name);if(!ex)continue;const s=(ex.sets||[]).filter(x=>logged(x)&&+x.kg>0);if(s.length)out.push(s);}return out;}
function suggest(name){
  const h=hist(name);if(!h.length)return null;
  const s=h[0],top=Math.max(...s.map(x=>+x.kg)),at=s.filter(x=>+x.kg===top),mn=Math.min(...at.map(x=>+x.reps));
  const m=(findLX(name)||{}).m||muscleOf(name),inc=LOWER.includes(m)||/deadlift/i.test(name)?5:2.5;
  if(h.length>=3&&best1(h[0])<=best1(h[2])+.01&&best1(h[1])<=best1(h[2])+.01)return{type:"deload",kg:Math.round(top*.9/2.5)*2.5,reps:8,msg:"No progress in 3 sessions, deload to rebuild"};
  if(mn>=8)return{type:"up",kg:top+inc,reps:8,msg:`You hit ${at.map(x=>x.reps).join(", ")} at ${top} kg, so add ${inc} kg`};
  return{type:"hold",kg:top,reps:mn+1,msg:`Stay at ${top} kg and aim for ${mn+1} reps on every set`};
}

function wireScan(sh,addItem,showResults){
  const res=$("#fres3",sh),inp=$("#bcIn",sh),vid=$("#bcVid",sh);let stream=null;
  const stopCam=()=>{if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;};
  const lookup=async code=>{
    res.innerHTML=`<div class="empty">Looking up ${esc(code)}…</div>`;
    try{const r=await fetch("https://world.openfoodfacts.org/api/v2/product/"+encodeURIComponent(code)+".json?fields=product_name,brands,serving_size,nutriments");const j=await r.json();if(j.status!==1)throw 0;
      const p=j.product,n=p.nutriments||{},nm=(p.product_name||"Product")+(p.brands?" ("+p.brands.split(",")[0]+")":""),L=[];
      if(n["energy-kcal_serving"]!=null)L.push({name:nm,serving:p.serving_size||"1 serving",cal:n["energy-kcal_serving"],p:n.proteins_serving||0,c:n.carbohydrates_serving||0,f:n.fat_serving||0});
      L.push({name:nm,serving:"100 g",cal:n["energy-kcal_100g"]||0,p:n.proteins_100g||0,c:n.carbohydrates_100g||0,f:n.fat_100g||0});
      showResults(res,L);
    }catch(e){res.innerHTML=`<div class="empty">Product not found, or you're offline. Try the Label photo tab.</div>`;}
  };
  $("#bcGo",sh).onclick=()=>{const c=inp.value.trim();if(c)lookup(c);};
  $("#bcCam",sh).onclick=async()=>{
    if(!("BarcodeDetector" in window)||!navigator.mediaDevices){res.innerHTML=`<div class="empty">Camera scanning isn't supported in this browser. Type the barcode number instead.</div>`;return;}
    try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});vid.srcObject=stream;vid.style.display="block";await vid.play();
      const det=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e"]});
      const loop=async()=>{if(!document.body.contains(vid)){stopCam();return;}try{const f=await det.detect(vid);if(f.length){stopCam();vid.style.display="none";inp.value=f[0].rawValue;lookup(f[0].rawValue);return;}}catch(e){}setTimeout(loop,300);};loop();
    }catch(e){res.innerHTML=`<div class="empty">Couldn't open the camera. Type the barcode number instead.</div>`;}
  };
}

function planOptions(routines){
  const o=[{k:"none",l:"Not planned"},{k:"rest",l:"Rest day"}];
  TCAT.weights.subs.forEach((x,i)=>o.push({k:"split",i,l:x[0],g:"Workout splits"}));
  Object.entries(routines||{}).filter(([id,r])=>!r.fav).sort((a,b)=>a[1].name.localeCompare(b[1].name)).forEach(([id,r])=>o.push({k:"r",id,l:r.name,g:(r.type&&r.type!=="gym"?(r.type==="yoga"?"Yoga":"Cardio"):"Weights")+" routines"}));
  TCAT.cardio.subs.forEach((x,i)=>o.push({k:"cardio",i,l:x[0],g:"Cardio"}));

const pKey=e=>!e?"none":e.k==="r"?"r:"+e.id:e.k+(e.i!=null?":"+e.i:"");
function planRows(plan,workouts){

}
function planStrip(rows){

function planStats(rows){const pl=rows.filter(r=>r.e&&r.e.k!=="rest"&&(r.past||r.today));return {due:pl.length,done:pl.filter(r=>r.done).length,extra:rows.filter(r=>r.done&&(!r.e||r.e.k==="rest")).length};}

  openSheet(`<h2>${swap!=null?"Swap exercise":"Add exercise"}</h2><input id="xq" type="search" placeholder="Search exercises" aria-label="Search exercises"><select id="xm" aria-label="Muscle group">${["All",...MUSCLES].map(x=>`<option>${x}</option>`).join("")}</select><div class="list results" id="xl"></div><details><summary style="cursor:pointer;font-weight:600">Custom exercise</summary><div class="stack" style="margin-top:8px">${exPicker()}<button class="btn primary block" id="exAddA">Add custom</button></div></details>`);
  const sh=$("#sheet");
  const apply=(name,muscle)=>{const a=S.active;if(swap!=null&&a.exercises[swap]){const ex=a.exercises[swap];ex.name=name;ex.muscle=muscle;ex.sets=ex.sets.map(()=>({kg:"",reps:"",done:false}));}else a.exercises.push({name,muscle,sets:[0,1,2].map(()=>({kg:"",reps:"",done:false}))});prefill(a);LS("active",a);closeSheet();render();};
  const draw=()=>{const k=q.toLowerCase();const L=LX.filter(x=>(m==="All"||x.m===m)&&(!k||x.n.toLowerCase().includes(k)));$("#xl",sh).innerHTML=L.map(x=>`<div class="item" data-n="${esc(x.n)}"><div class="grow"><div class="title">${esc(x.n)}</div><div class="meta">${esc((MD[x.n]||[x.m])[0])}</div></div><span class="pill">${esc(x.m)}</span></div>`).join("")||`<div class="empty">No match. Use Custom exercise below.</div>`;};
  draw();
  $("#xq",sh).addEventListener("input",e=>{q=e.target.value;draw();});
  $("#xm",sh).addEventListener("change",e=>{m=e.target.value;draw();});
  $("#xl",sh).onclick=e=>{const it=e.target.closest("[data-n]");if(!it)return;const x=LX.find(y=>y.n===it.dataset.n);apply(x.n,x.m);};
  wireExPicker(sh);
  $("#exAddA",sh).onclick=()=>{const e=readExPicker(sh);if(e)apply(e.name,e.muscle);};
}

const COACH={list:null,sel:null,data:null};
function coach(){
  if(!S.isCoach)return `<div class="empty">The coach view is for the app owner and editors.</div>`;
  if(COACH.list===null){coachLoad();return `<div class="empty">Loading members…</div>`;}
  if(COACH.sel){
    const m=COACH.list.find(x=>x.id===COACH.sel)||{name:"Member"},d=COACH.data;
    const head=`<button class="btn sm" style="align-self:flex-start" data-act2="coachBack">‹ All members</button><div class="mid num">${esc(m.name)}</div>`;
    if(!d)return head+`<div class="empty">Loading…</div>`;
    const tg=(d.settings&&d.settings.main)||{},unit=tg.unit||"kg";
    const hm=ts=>new Date(ts).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
    const stamp=ts=>{if(!ts)return "";const dd=ymd(new Date(ts)),t=ymd(),y=ymd(new Date(Date.now()-864e5));return (dd===t?"Today":dd===y?"Yesterday":new Date(ts).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"}))+", "+hm(ts);};
    const late=(ts,day)=>ts&&ymd(new Date(ts))!==day?" (logged "+stamp(ts)+")":"";
    const row=(t,mt,v,sub,wid)=>wid?`<button class="item" style="width:100%;text-align:left;cursor:pointer;background:none;border:0;border-bottom:1px solid var(--line);color:inherit;font:inherit" data-act2="coachWk" data-id="${esc(wid)}" aria-label="See full workout: ${esc(t)}"><div class="grow"><div class="title">${esc(t)}</div><div class="meta">${esc(mt)}</div>${sub||""}</div><div class="val">${esc(v)} <span class="muted" aria-hidden="true">›</span></div></button>`:`<div class="item"><div class="grow"><div class="title">${esc(t)}</div><div class="meta">${esc(mt)}</div>${sub||""}</div><div class="val">${esc(v)}</div></div>`;
    // ---- activity feed: every post, newest first ----
    const feed=[];
    Object.entries(d.days).forEach(([day,doc])=>(doc.meals||[]).forEach(m=>feed.push({ts:m.t||null,day,k:"🍽",t:`${m.meal||"Food"}: ${m.name}`,v:r0(m.cal)+" kcal"})));
    Object.entries(d.workouts).forEach(([wid,w])=>feed.push({wid,ts:w.end||w.start||null,day:w.date,k:"🏋",t:`Workout: ${w.name||w.type}`,v:w.type==="gym"?r0(sum(w.exercises||[],volOf))+" kg":(w.duration?r0(w.duration)+" min":"")}));
    Object.entries(d.body).forEach(([day,bd])=>{if(bwKg(bd,tg))feed.push({ts:bd.t||null,day,k:"⚖",t:"Weigh-in",v:bwFmt(bwKg(bd,tg),bwU(tg))});});
    feed.sort((x,y)=>(y.ts||Date.parse(y.day+"T12:00"))-(x.ts||Date.parse(x.day+"T12:00")));
    const fd=feed.slice(0,15);
    const feedCard=`<div class="card"><h2>Recent activity</h2>${fd.length?`<div class="list">${fd.map(f=>row(f.k+" "+f.t,f.ts?"Posted "+stamp(f.ts)+(ymd(new Date(f.ts))!==f.day?" · for "+fmtDate(f.day):""):fmtDate(f.day)+" · time not recorded",f.v,"",f.wid)).join("")}</div>`:`<div class="empty">Nothing posted yet.</div>`}</div>`;
    // ---- food by day, each item with its time ----
    const days=Object.keys(d.days).filter(k=>(d.days[k].meals||[]).length).sort().slice(-7).reverse();
    const foodCard=`<div class="card"><h2>Food, last 7 logged days</h2>${days.length?`<div class="list">${days.map(k=>{
      const ml=[...(d.days[k].meals||[])].sort((x,y)=>(x.t||0)-(y.t||0)),tot=r0(sum(ml,x=>x.cal)),ts=ml.map(x=>x.t).filter(Boolean);
      const span=ts.length?` · ${ml.length} item${ml.length>1?"s":""} logged ${hm(Math.min(...ts))}${ts.length>1?"–"+hm(Math.max(...ts)):""}`:` · ${ml.length} item${ml.length>1?"s":""}`;
      const items=`<details class="muted small" style="margin-top:6px"><summary style="cursor:pointer">Show entries</summary><div style="margin-top:6px;line-height:1.7">${ml.map(x=>`<div class="row between" style="gap:8px"><span>${x.photo?`<img src="${x.photo}" alt="" style="width:32px;height:32px;border-radius:6px;object-fit:cover;vertical-align:middle;margin-right:6px">`:""}<b class="num" style="color:var(--fg)">${x.t?hm(x.t):"--:--"}</b> · ${esc(x.meal||"")} · ${esc(x.name)}${x.serving?" ("+esc(x.serving)+")":""}${x.t&&ymd(new Date(x.t))!==k?` <i>(logged ${esc(stamp(x.t))})</i>`:""}</span><span class="num">${r0(x.cal)} kcal</span></div>`).join("")}</div></details>`;
      const ff=(d.feedback||{})["food-"+k];
      return row(fmtDate(k),`P ${r0(sum(ml,x=>x.p))} C ${r0(sum(ml,x=>x.c))} F ${r0(sum(ml,x=>x.f))}${span}`,tot+(tg.cal?" / "+r0(tg.cal):"")+" kcal",items+(ff?`<div class="meta" style="color:var(--accent);margin-top:4px">💬 ${esc(ff.text.length>60?ff.text.slice(0,60)+"…":ff.text)}${ff.seen?" · Seen":""}</div>`:"")+`<button class="btn sm" style="margin-top:6px" data-act2="coachDayFb" data-day="${k}">💬 ${ff?"Edit review":"Review this day"}</button>`);
    }).join("")}</div>`:`<div class="empty">No food logged.</div>`}</div>`;
    // ---- workouts with session time and posting time ----
    const ws=Object.entries(d.workouts).map(([wid,w])=>({...w,_id:wid})).sort((x,y)=>(y.end||y.start||Date.parse(y.date))-(x.end||x.start||Date.parse(x.date))).slice(0,10);
    const wCard=`<div class="card"><div class="row between"><h2>Workouts</h2><span class="muted small">Tap a workout for sets &amp; reps</span></div>${ws.length?`<div class="list">${ws.map(w=>{
      const bits=[w.type==="gym"?(w.exercises||[]).length+" exercise"+((w.exercises||[]).length===1?"":"s"):null,w.duration?r0(w.duration)+" min":null,w.distance?r1(w.distance)+" km":null,w.rpe?"RPE "+w.rpe:null].filter(Boolean).join(" · ");
      const when=w.start&&w.end?`${fmtDate(w.date)} · ${hm(w.start)}–${hm(w.end)}`:fmtDate(w.date);
      const posted=(w.end?`<div class="meta">Posted ${esc(stamp(w.end))}</div>`:`<div class="meta">Posted: time not recorded</div>`)+((d.feedback||{})[w._id]?`<div class="meta" style="color:var(--accent)">💬 Feedback sent</div>`:"");
      return row(w.name||w.type,when+(bits?" · "+bits:""),w.type==="gym"?r0(sum(w.exercises||[],volOf))+" kg":(w.duration?r0(w.duration)+" min":""),posted,w._id);
    }).join("")}</div>`:`<div class="empty">No workouts logged.</div>`}</div>`;
    // ---- weigh-ins with posting time ----
    const bs=Object.entries(d.body).map(([date,x])=>({date,...x})).filter(x=>bwKg(x,tg)).sort((x,y)=>y.date.localeCompare(x.date)).slice(0,8);
    const cpts=bwPoints(d.body,tg).filter(p=>p.date>=addDays(ymd(),-90));
    const bCard=`<div class="card"><h2>Weight</h2>${cpts.length>=2?`<div style="margin-bottom:8px">${bwChart(cpts,bwU(tg),"Member weight trend, last 3 months",tg.goalKg)}${(()=>{const pj=bwProj(bwPoints(d.body,tg),tg.goalKg,bwU(tg));return pj?`<div class="small" style="margin-top:6px;color:${pj.warn?"var(--warn)":"var(--good)"}">🎯 Goal ${esc(bwFmt(tg.goalKg,bwU(tg)))} · ${esc(pj.toGo)}. ${esc(pj.txt)}</div>`:"";})()}</div>`:""}${bs.length?`<div class="list">${bs.map((x,i)=>{const prev=bs[i+1],ch=prev?bwKg(x,tg)-bwKg(prev,tg):null;return row(fmtDate(x.date),x.t?"Posted "+stamp(x.t):"Posted: time not recorded",bwFmt(bwKg(x,tg),bwU(tg)),ch!=null&&Math.abs(ch)>=0.05?`<div class="meta">${bwDelta(ch,bwU(tg))} since ${fmtDate(prev.date)}</div>`:"");}).join("")}</div>`:`<div class="empty">No weigh-ins.</div>`}</div>`;
    return head+`<div class="card"><h2>Targets</h2><div class="muted small">${esc(tg.goal||"No goal set")} · ${r0(tg.cal)||"–"} kcal · P ${r0(tg.protein)||"–"} C ${r0(tg.carbs)||"–"} F ${r0(tg.fat)||"–"}</div></div>`+(()=>{const rows=planRows(d.plan,d.workouts),st=planStats(rows),any=rows.some(r=>r.e);return `<div class="card"><div class="row between"><h2>This week's plan</h2><button class="btn sm" data-act2="coachPlan">${any?"Edit plan":"Set plan"}</button></div>${any?planStrip(rows)+`<div class="muted small" style="margin-top:8px">${st.done} of ${st.due} planned sessions done so far${st.extra?` · ${st.extra} extra session${st.extra>1?"s":""}`:""}</div>`:`<div class="muted small">No plan yet. Set one and it shows on their Train page with one-tap Start.</div>`}</div>`;})()+feedCard+foodCard+wCard+bCard;
  }
  return `<div class="row between"><div class="mid num">Members</div><button class="btn sm" data-act2="coachRefresh">Refresh</button></div>`+(COACH.list.length?COACH.list.map(m=>`<div class="card"><div class="row between"><div><div class="title" style="font-weight:600">${esc(m.name)}</div><div class="muted small">${esc(m.email||"")} · Last active ${m.lastSeen?fmtDate(ymd(new Date(m.lastSeen))):"never"}</div></div><button class="btn sm primary" data-act2="coachOpen" data-id="${esc(m.id)}">Open</button></div></div>`).join(""):`<div class="empty">No members yet. Share the link and give people Contributor access.</div>`);
}

// ---------- Firebase: sign-in, per-user storage, coach ----------
const AUTH={mode:"in",err:"",email:"",loading:true,done:false};
function authEl(){let el=$("#auth");if(!el){el=document.createElement("div");el.id="auth";el.style.cssText="position:fixed;inset:0;z-index:100;background:var(--bg);overflow-y:auto;padding:calc(48px + env(safe-area-inset-top,0px)) 20px 40px";document.body.appendChild(el);}return el;}
function hideAuth(){const el=$("#auth");if(el)el.remove();}
function drawAuth(){
  const el=authEl(),logo=`<div style="font-family:var(--display);font-weight:700;font-size:44px;letter-spacing:.14em;color:var(--accent)">FORM</div>`;
  if(AUTH.loading){el.innerHTML=`<div style="max-width:380px;margin:0 auto" class="stack">${logo}<div class="muted">Loading…</div></div>`;return;}
  const up=AUTH.mode==="up";
  el.innerHTML=`<div style="max-width:380px;margin:0 auto" class="stack">${logo}<div class="muted">${up?"Create your account":"Sign in to your account"}</div>
  ${up?`<div class="field"><label>Name</label><input id="auName" autocomplete="name"></div>`:""}
  <div class="field"><label>Email</label><input id="auEmail" type="email" inputmode="email" autocomplete="email" value="${esc(AUTH.email)}"></div>
  <div class="field"><label>Password</label><input id="auPass" type="password" autocomplete="${up?"new-password":"current-password"}"></div>
  <div class="small" style="color:var(--bad);min-height:18px">${esc(AUTH.err)}</div>
  <button class="btn primary block" id="auGo">${up?"Create account":"Sign in"}</button>
  <button class="btn block" id="auSw">${up?"I already have an account":"Create a new account"}</button>
  ${up?"":`<button class="btn block" id="auReset">Forgot password</button>`}
  <div class="muted small">Your food, workouts and body entries are saved to your account. The app owner can view them to coach you.</div></div>`;
  const val=id=>($("#"+id)||{}).value||"";
  const msg=e=>({"auth/invalid-credential":"Email or password is wrong.","auth/invalid-email":"That email address isn't valid.","auth/email-already-in-use":"An account with that email already exists.","auth/weak-password":"Use a password of at least 6 characters.","auth/too-many-requests":"Too many attempts. Try again later.","auth/network-request-failed":"No connection. Try again."})[e&&e.code]||"Something went wrong. Try again.";
  $("#auSw").onclick=()=>{AUTH.email=val("auEmail");AUTH.mode=up?"in":"up";AUTH.err="";drawAuth();};
  $("#auGo").onclick=async()=>{AUTH.email=val("auEmail").trim();const p=val("auPass");if(!AUTH.email||!p){AUTH.err="Enter your email and password.";drawAuth();return;}$("#auGo").disabled=true;try{if(up)await FB.signUp(AUTH.email,p,val("auName").trim());else await FB.signIn(AUTH.email,p);}catch(e){AUTH.err=msg(e);drawAuth();}};
  if(!up)$("#auReset").onclick=async()=>{AUTH.email=val("auEmail").trim();if(!AUTH.email){AUTH.err="Enter your email first.";drawAuth();return;}try{await FB.reset(AUTH.email);AUTH.err="Reset email sent. Check your inbox.";}catch(e){AUTH.err=msg(e);}drawAuth();};
}
function startFirebase(){
  S.sample={limits:async()=>({images:false}),json:async p=>{
    const q=String(p).split("Food:").pop().trim(),m=q.match(/(\d+(?:\.\d+)?)\s*(?:g|grams?)\b/i),gr=m?+m[1]:100,term=(m?q.replace(m[0],""):q).trim()||q,k=gr/100;
    const r=await fetch("https://world.openfoodfacts.org/cgi/search.pl?action=process&json=1&page_size=15&fields=product_name,brands,nutriments&search_terms="+encodeURIComponent(term));
    const j=await r.json(),out=[];
    (j.products||[]).forEach(x=>{const n=x.nutriments||{};if(n["energy-kcal_100g"]==null)return;out.push({name:(x.product_name||"Product")+(x.brands?" ("+x.brands.split(",")[0]+")":""),serving:gr+" g",cal:n["energy-kcal_100g"]*k,p:(n.proteins_100g||0)*k,c:(n.carbohydrates_100g||0)*k,f:(n.fat_100g||0)*k});});
    return out.slice(0,8);}};
  S.assets={upload:file=>new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,520/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res({id:"inline",url:c.toDataURL("image/jpeg",.7)});};img.onerror=rej;img.src=u;})};
  drawAuth();
  setTimeout(()=>{if(!AUTH.done&&!window.FB){hideAuth();}},8000);
  const go=()=>{AUTH.done=true;window.FB.onAuth(onUser);};
  if(window.FB)go();else window.addEventListener("fbready",go,{once:true});
}
async function onUser(u){
  const F=window.FB;
  if(!u){AUTH.loading=false;S.db=null;S.online=false;S.isCoach=false;SYNC.pending=0;SYNC.failed={};SYNC.loaded=false;syncUI();drawAuth();return;}
  hideAuth();
  const prev=LS("uid");
  if(prev&&prev!==u.uid){COLLS.forEach(c=>S[c]=c==="settings"?{...DEFAULT_SETTINGS}:{});S.active=null;LS("active",null);saveCache();}
  S.uid=u.uid;S.email=u.email;S.name=u.displayName||"";S.online=true;
  const col=c=>F.collection(F.db,"users",u.uid,c);
  SYNC.loaded=false;SYNC.ld=new Set();setTimeout(syncUI,0);setTimeout(()=>{if(!SYNC.loaded){SYNC.loaded=true;syncUI();setTimeout(obCheck,300);}},15000);
  S.db={collection:c=>({doc:id=>({set:d=>F.setDoc(F.doc(F.db,"users",u.uid,c,id),d),delete:()=>F.deleteDoc(F.doc(F.db,"users",u.uid,c,id))})})};
  F.setDoc(F.doc(F.db,"users",u.uid),{email:u.email,lastSeen:Date.now()},{merge:true}).catch(()=>{});
  if(!prev){// first sign-in on this device: upload only what the account doesn't already have (never overwrite saved targets)
    try{for(const c of COLLS){
      if(c==="feedback")continue;
      const have=new Set((await F.getDocs(col(c))).docs.map(d=>d.id));
      if(c==="settings"){if(!have.has("main")&&JSON.stringify(S.settings)!==JSON.stringify(DEFAULT_SETTINGS))await F.setDoc(F.doc(F.db,"users",u.uid,"settings","main"),S.settings);continue;}
      for(const id of Object.keys(S[c]||{}))if(!have.has(id))await F.setDoc(F.doc(F.db,"users",u.uid,c,id),S[c][id]);
    }}catch(e){console.warn("first sync",e);}
  }
  LS("uid",u.uid);
  F.getDocs(F.collection(F.db,"users")).then(()=>{S.isCoach=true;render();}).catch(()=>{S.isCoach=false;});
  setTimeout(()=>{try{pushRefresh();}catch(e){}},3000);
  for(const coll of COLLS){
    F.onSnapshot(col(coll),snap=>{
      const o={};snap.docs.forEach(d=>{o[d.id]=d.data();});
      if(coll==="settings"){if(o.main)S.settings={...DEFAULT_SETTINGS,...o.main};}else S[coll]=o;

// ---------- BODY ----------
function weightCard(){
  const u=bwU(),all=bwPoints(S.body),R=LS("wRange")??90;
  const pts=R?all.filter(p=>p.date>=addDays(ymd(),-R)):all;
  const seg=`<div class="seg" role="group" aria-label="Time range">${[[30,"1M"],[90,"3M"],[180,"6M"],[365,"1Y"],[0,"All"]].map(([r,l])=>`<button aria-pressed="${R===r}" data-act2="wRange" data-r="${r}">${l}</button>`).join("")}</div>`;
  const useg=`<div class="seg" style="width:auto" role="group" aria-label="Weight unit">${BWU.map(([k,l])=>`<button style="padding:2px 8px;font-size:11px;min-height:26px" aria-pressed="${u===k}" data-act2="bwUnit" data-u="${k}">${l}</button>`).join("")}</div>`;
  const head=`<div class="row between" style="gap:6px;margin-bottom:8px"><h2 style="margin:0">Weight trend</h2>${useg}</div>`;
  if(!all.length)return `<div class="card">${head}<div class="empty">Log your weight above and your trend graph appears here.</div></div>`;
  const first=pts[0],last=all[all.length-1],ch=first&&pts.length>1?last.kg-first.kg:null;
  const kgs=pts.map(p=>p.kg),lo=pts.length?Math.min(...kgs):null,hi=pts.length?Math.max(...kgs):null;
  const stat=(l,v,c)=>`<div class="card" style="padding:8px;text-align:center;background:var(--surface2)"><div class="num" style="font-weight:700;font-size:14px;${c?"color:"+c:""}">${v}</div><div class="muted small">${l}</div></div>`;
  return `<div class="card">${head}${seg}
    <div style="margin-top:10px">${pts.length>=2?bwChart(pts,u,"Weight trend",S.settings.goalKg):`<div class="empty">${pts.length?"Only one weigh-in in this period. Pick a longer range or log again.":"No weigh-ins in this period."}</div>`}</div>
    <div class="grid2" style="margin-top:8px;grid-template-columns:repeat(4,1fr);gap:6px">
      ${stat("Latest",esc(bwFmt(last.kg,u)))}
      ${stat("Change",ch==null||Math.abs(ch)<0.05?"–":esc(bwDelta(ch,u)),ch==null?"":ch<0?"var(--good)":"var(--warn)")}
      ${stat("Lowest",lo!=null?esc(bwFmt(lo,u)):"–")}
      ${stat("Highest",hi!=null?esc(bwFmt(hi,u)):"–")}
    </div>
    ${(()=>{const gk=S.settings.goalKg,pj=bwProj(all,gk,u);return gk?`<div class="coach" style="margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-left:3px solid ${pj&&pj.warn?"var(--warn)":"var(--good)"}"><div><b>🎯 Goal ${esc(bwFmt(gk,u))}</b>${pj?` · ${esc(pj.toGo)}<div class="muted" style="margin-top:2px">${esc(pj.txt)}</div>`:""}</div><button class="btn sm" data-act2="goalSheet">Edit</button></div>`:`<button class="btn block" style="margin-top:10px" data-act2="goalSheet">🎯 Set a goal weight</button>`;})()}
    </div>`;
}

async function saveBody(){
  const v=id=>{const x=$("#"+id);return x&&x.value!==""?+x.value:null;};
  const d=ymd(),nw=bwRead("bW"),cur=S.body[d]||{};const entry={...cur,weight:nw!=null?Math.round(nw*1000)/1000:(cur.weight??null),wu:nw!=null?"kg":(cur.wu||null),bf:v("bBf")??(S.body[d]||{}).bf??null,waist:v("bWaist")??(S.body[d]||{}).waist??null,chest:v("bChest")??(S.body[d]||{}).chest??null,arm:v("bArm")??(S.body[d]||{}).arm??null,thigh:v("bThigh")??(S.body[d]||{}).thigh??null};
  const ph=$("#bPhoto");if(ph&&ph.files[0]&&S.assets){try{toast("Uploading photo…");const r=await S.assets.upload(ph.files[0]);entry.photoId=r.id;entry.photoUrl=r.url;}catch(e){toast("Photo upload failed");}}
  if(entry.weight==null&&entry.bf==null&&entry.waist==null&&entry.chest==null&&entry.arm==null&&entry.thigh==null&&!entry.photoId){toast("Enter at least one measurement");return;}
  entry.t=Date.now();

}

// ---------- STATS ----------
function statsBase(){
  const g=S.settings;const b=bodySorted().filter(x=>x.weight!=null).slice(-30);
  // weekly calories: last 7 days
  const days=[...Array(7)].map((_,i)=>addDays(ymd(),i-6));const cals=days.map(d=>dayTotals(d).cal);
  // volume per muscle, last 7 days
  const since=addDays(ymd(),-6);const vol={};for(const w of Object.values(S.workouts)){if(w.date<since)continue;for(const ex of w.exercises||[]){const m=ex.muscle||muscleOf(ex.name);vol[m]=(vol[m]||0)+volOf(ex);}}
  const volRows=Object.entries(vol).sort((a,b)=>b[1]-a[1]);const maxV=Math.max(1,...volRows.map(x=>x[1]));
  const p=prs().slice(0,8);const st=streak();const wk=Object.values(S.workouts).filter(w=>w.date>=since).length;
  return `<div class="grid2"><div class="card"><h2>Streak</h2><div class="big num">${st}</div><div class="muted small">days</div></div><div class="card"><h2>This week</h2><div class="big num">${wk}</div><div class="muted small">sessions</div></div></div>
  <div class="card"><h2>Weight trend</h2>${bwPoints(S.body).slice(-30).length>=2?bwChart(bwPoints(S.body).slice(-30),bwU(),"Weight trend"):`<div class="empty">Log at least two weigh-ins in Body to see a trend.</div>`}</div>
  <div class="card"><h2>Calories, last 7 days</h2>${barChart(cals,days.map(d=>parseYmd(d).toLocaleDateString("en-GB",{weekday:"narrow"})),g.cal)}</div>
  <div class="card"><h2>Volume per muscle, 7 days</h2>${volRows.length?`<div class="stack">${volRows.map(([m,v])=>`<div class="hbar"><span>${esc(m)}</span><div class="bar"><i style="width:${v/maxV*100}%"></i></div><span class="v">${r0(v)} kg</span></div>`).join("")}</div>`:`<div class="empty">No lifting logged this week.</div>`}</div>
  <div class="card"><h2>Strength PRs</h2><div class="muted small" style="margin-bottom:6px">Best set by estimated 1RM (Epley).</div>${p.length?`<div class="list">${p.map(x=>`<div class="item"><div class="grow"><div class="title">${esc(x.name)}</div><div class="meta">${x.kg} kg × ${x.reps} · ${fmtDate(x.date)}</div></div><div class="val">${r0(x.e1)} <span class="muted small">e1RM</span></div></div>`).join("")}</div>`:`<div class="empty">PRs appear once you've completed sets with weight.</div>`}</div>`;
}
function lineChart(vals,labels,unit){
  const W=360,H=160,pl=36,pr=10,pt=12,pb=26;const lo=Math.floor(Math.min(...vals)-1),hi=Math.ceil(Math.max(...vals)+1);
  const x=i=>pl+(W-pl-pr)*(vals.length===1?0.5:i/(vals.length-1)),y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo||1));
  const ticks=[lo,(lo+hi)/2,hi];const pts=vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`);
  const area=`M${pts[0]} L${pts.join(" L")} L${x(vals.length-1).toFixed(1)},${(H-pb).toFixed(1)} L${x(0).toFixed(1)},${(H-pb).toFixed(1)} Z`;
  const lab=i=>parseYmd(labels[i]).toLocaleDateString("en-GB",{day:"numeric",month:"short"});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight trend">${ticks.map(t=>`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}"/><text x="${pl-6}" y="${y(t)+4}" text-anchor="end">${r1(t)}</text>`).join("")}<path class="area" d="${area}"/><polyline class="line" points="${pts.join(" ")}"/><circle class="dot" cx="${x(vals.length-1)}" cy="${y(vals[vals.length-1])}" r="4"/><text x="${pl}" y="${H-8}">${lab(0)}</text><text x="${W-pr}" y="${H-8}" text-anchor="end">${lab(vals.length-1)}</text><text x="${x(vals.length-1)}" y="${y(vals[vals.length-1])-9}" text-anchor="end" style="fill:var(--fg);font-weight:600">${r1(vals[vals.length-1])} ${unit}</text></svg>`;
}
function barChart(vals,labels,target){
  const W=360,H=150,pl=36,pr=10,pt=12,pb=22;const hi=Math.max(target*1.15,...vals,100);const y=v=>pt+(H-pt-pb)*(1-v/hi);const n=vals.length,bw=(W-pl-pr)/n;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Calories per day">${[0,hi/2,hi].map(t=>`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}"/><text x="${pl-6}" y="${y(t)+4}" text-anchor="end">${r0(t)}</text>`).join("")}${vals.map((v,i)=>`<rect class="bar ${v?"":"dim"}" x="${pl+i*bw+bw*.2}" y="${y(v||0)}" width="${bw*.6}" height="${Math.max(v?2:2,(H-pb)-y(v||0))}" rx="3"/><text x="${pl+i*bw+bw/2}" y="${H-6}" text-anchor="middle">${labels[i]}</text>`).join("")}<line class="target" x1="${pl}" x2="${W-pr}" y1="${y(target)}" y2="${y(target)}"/><text x="${W-pr}" y="${y(target)-4}" text-anchor="end">target ${target}</text></svg>`;
}

// ---------- routines ----------
function routineSheet(id){
  const r=id?{...S.routines[id],exercises:(S.routines[id].exercises||[]).map(e=>({...e}))}:{name:"",type:"gym",exercises:[]};
  const draw=()=>{const sh=$("#sheet");$("#rList",sh).innerHTML=r.exercises.map((e,i)=>`<div class="item"><div class="grow"><div class="title">${esc(e.name)}</div><div class="meta">${esc(e.muscle)} · ${e.sets} × ${e.reps}</div></div><button class="x" data-ri="${i}" aria-label="Remove"><svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>`).join("")||`<div class="empty">Add exercises below.</div>`;};
  openSheet(`<h2>${id?"Edit":"New"} routine</h2><div class="field"><label>Name</label><input id="rName" value="${esc(r.name)}" placeholder="Push day"></div><div class="list" id="rList"></div>
  <div class="card" style="background:var(--surface2)"><div class="stack">${exPicker()}<div class="grid2"><div class="field"><label>Sets</label><input id="exSets" type="number" inputmode="numeric" value="3"></div><div class="field"><label>Rep range</label><input id="exReps" value="8–12"></div></div><button class="btn block" id="exAddR">+ Add to routine</button></div></div>
  <div class="grid2">${id?`<button class="btn danger" id="rDel">Delete</button>`:`<span></span>`}<button class="btn primary" id="rSave">Save routine</button></div>`);
  const sh=$("#sheet");draw();wireExPicker(sh);
  $("#exAddR",sh).onclick=()=>{const e=readExPicker(sh);if(!e)return;r.exercises.push({...e,sets:+$("#exSets",sh).value||3,reps:$("#exReps",sh).value||"8–12"});draw();};
  $("#rList",sh).onclick=e=>{const b=e.target.closest("[data-ri]");if(b){r.exercises.splice(+b.dataset.ri,1);draw();}};
  $("#rSave",sh).onclick=()=>{r.name=$("#rName",sh).value.trim()||"Routine";save("routines",id||uid(),r);closeSheet();render();};
  if(id)$("#rDel",sh).onclick=()=>{remove("routines",id);closeSheet();render();};
}
function exPicker(){return `<div class="field"><label>Exercise</label><input id="exName" list="exlist" placeholder="Start typing…" autocomplete="off"><datalist id="exlist">${LIB.map(x=>`<option value="${esc(x[0])}">`).join("")}</datalist></div><div class="field"><label>Muscle</label><select id="exMuscle">${MUSCLES.map(m=>`<option>${m}</option>`).join("")}<option>Other</option></select></div>`;}
function wireExPicker(sh){$("#exName",sh).addEventListener("input",e=>{const m=muscleOf(e.target.value);if(m!=="Other")$("#exMuscle",sh).value=m;});}
function readExPicker(sh){const name=$("#exName",sh).value.trim();if(!name){toast("Pick an exercise");return null;}const muscle=$("#exMuscle",sh).value;if(muscleOf(name)==="Other"){S.exMuscle[name.toLowerCase()]=muscle;LS("exMuscle",S.exMuscle);}$("#exName",sh).value="";return{name,muscle};}
function addExSheet(){openSheet(`<h2>Add exercise</h2>${exPicker()}<button class="btn primary block" id="exAddA">Add</button>`);const sh=$("#sheet");wireExPicker(sh);$("#exAddA",sh).onclick=()=>{const e=readExPicker(sh);if(!e)return;S.active.exercises.push({...e,sets:[{kg:"",reps:"",done:false},{kg:"",reps:"",done:false},{kg:"",reps:"",done:false}]});LS("active",S.active);closeSheet();render();};}

    case "repeatLast":{const last=workoutsSorted().find(w=>w.type==="gym"&&(w.exercises||[]).length);if(!last)break;startWorkout({type:"gym",name:last.name,exercises:last.exercises.map(x=>({name:x.name,muscle:x.muscle,sets:x.sets.map(s=>({kg:s.kg||"",reps:s.reps||"",done:false}))}))});break;}
    case "copyYesterday":{const y=dayDoc(addDays(S.foodDate,-1)).meals||[];if(!y.length){toast("Nothing logged yesterday");break;}const doc={...dayDoc(S.foodDate)};doc.meals=[...(doc.meals||[]),...y.map(m=>({...m,id:uid(),t:Date.now()}))];await save("days",S.foodDate,doc);toast("Copied yesterday's meals");render();break;}
    case "delBody":await remove("body",ds.id);render();break;
  }
});
document.body.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.exrpe!==undefined&&S.active){S.active.exercises[+t.dataset.exrpe].rpe=t.value;LS("active",S.active);}
  else if(t.dataset.set&&S.active){S.active.exercises[+t.dataset.ei].sets[+t.dataset.si][t.dataset.set]=t.value;LS("active",S.active);const c=document.getElementById("wkSets");if(c){const ex=S.active.exercises;c.textContent=sum(ex,e=>e.sets.filter(entered).length)+" / "+sum(ex,e=>e.sets.length)+" sets logged";}}
  else if(t.dataset.bind&&S.active){S.active[t.dataset.bind]=t.value;LS("active",S.active);}
  else if(t.dataset.act==="restSec"){S.settings.restSec=+t.value||90;saveCache();}
});
document.body.addEventListener("change",e=>{if(e.target.dataset.act==="restSec")save("settings","main",{...S.settings,restSec:+e.target.value||90});});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();});

{const qp=new URLSearchParams(location.search),qt=qp.get("tab");if(qt&&["today","food","train","body","stats","more"].includes(qt))S.tab=qt;if(qp.get("view")==="history")S.trainView="history";if(/^\d{4}-\d{2}-\d{2}$/.test(qp.get("date")||""))S.foodDate=qp.get("date");if(qt||location.search.includes("source=pwa"))history.replaceState(null,"",location.pathname);}
render();
startFirebase();
})();
</script>
