<style>

.rest{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:7;background:var(--accent);color:var(--accent-fg);border-radius:14px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.35)}

/* sheets */

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:500;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}

.banner{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--muted)}

/* charts */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--body);font-size:11px}

.ring svg{width:190px;height:190px}
.arc{animation:arc 1s ease-out}@keyframes arc{from{stroke-dashoffset:var(--c)}}

.prfx div{font-size:80px}.prfx b{font-family:var(--display);font-size:44px;color:var(--accent);letter-spacing:.08em;text-transform:uppercase}
@keyframes prin{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1.08)}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.wkbtns .btn{padding:8px 4px;font-size:13px;min-height:36px;white-space:nowrap}
.exrow .btn{padding:6px 8px;font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
(function(){
"use strict";
// ---------- utils ----------
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>{d=d||new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());};
const parseYmd=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const addDays=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d);};
const fmtDate=s=>{const d=parseYmd(s);const t=ymd();if(s===t)return "Today";if(s===addDays(t,-1))return "Yesterday";return d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});};
const r1=n=>Math.round((+n||0)*10)/10, r0=n=>Math.round(+n||0);
const sum=(a,f)=>a.reduce((s,x)=>s+(+f(x)||0),0);
const mmss=s=>pad(Math.floor(s/60))+":"+pad(s%60);
let toastT;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),1800);}
const LS=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem("form."+k)||"null");localStorage.setItem("form."+k,JSON.stringify(v));if(k==="active"&&v&&v.day)rememberDay(v);}catch(e){return null;}};

// ---------- exercise library ----------
const MUSCLES=["Chest","Back","Shoulders","Biceps","Triceps","Quads","Hamstrings","Glutes","Calves","Core"];
const LIB=[["Bench Press","Chest"],["Incline Dumbbell Press","Chest"],["Dumbbell Bench Press","Chest"],["Cable Fly","Chest"],["Push-Up","Chest"],["Dip","Chest"],
["Deadlift","Back"],["Barbell Row","Back"],["Pull-Up","Back"],["Lat Pulldown","Back"],["Seated Cable Row","Back"],["Dumbbell Row","Back"],["Chest-Supported Row","Back"],
["Overhead Press","Shoulders"],["Dumbbell Shoulder Press","Shoulders"],["Lateral Raise","Shoulders"],["Face Pull","Shoulders"],["Rear Delt Fly","Shoulders"],
["Barbell Curl","Biceps"],["Dumbbell Curl","Biceps"],["Hammer Curl","Biceps"],["Preacher Curl","Biceps"],
["Tricep Pushdown","Triceps"],["Skull Crusher","Triceps"],["Overhead Tricep Extension","Triceps"],["Close-Grip Bench","Triceps"],
["Back Squat","Quads"],["Front Squat","Quads"],["Leg Press","Quads"],["Leg Extension","Quads"],["Bulgarian Split Squat","Quads"],["Hack Squat","Quads"],
["Romanian Deadlift","Hamstrings"],["Leg Curl","Hamstrings"],["Good Morning","Hamstrings"],
["Hip Thrust","Glutes"],["Glute Bridge","Glutes"],["Cable Kickback","Glutes"],
["Standing Calf Raise","Calves"],["Seated Calf Raise","Calves"],
["Plank","Core"],["Hanging Leg Raise","Core"],["Cable Crunch","Core"],["Ab Wheel","Core"]];
const muscleOf=name=>{const n=String(name||"").toLowerCase();const hit=LIB.find(x=>x[0].toLowerCase()===n);if(hit)return hit[1];return (S.exMuscle||{})[n]||"Other";};

// ---------- state & storage ----------
const S={tab:"today",foodDate:ymd(),days:{},workouts:{},body:{},routines:{},foods:{},settings:null,active:LS("active")||null,rest:null,exMuscle:LS("exMuscle")||{},db:null,uid:null,sample:null,assets:null,online:false,trainView:"routines"};
const DEFAULT_SETTINGS={cal:2200,protein:170,carbs:220,fat:70,restSec:90,unit:"kg",goal:"Gain muscle"};
const COLLS=["days","workouts","body","routines","foods","settings"];
const cache=LS("cache")||{};
for(const c of COLLS){ if(cache[c]) S[c]=cache[c]; }
if(cache.settings&&cache.settings.main) S.settings=cache.settings.main; else S.settings={...DEFAULT_SETTINGS};
function saveCache(){const o={};for(const c of COLLS)o[c]=S[c];o.settings={main:S.settings};LS("cache",o);}

async function save(coll,id,data){
  if(coll==="settings"){S.settings=data;}else{S[coll][id]=data;}
  saveCache();
  if(S.db){try{await S.db.collection(coll).doc(id).set(data);}catch(e){console.warn("db set",e);toast("Saved on this phone only");}}
}
async function remove(coll,id){
  delete S[coll][id];saveCache();
  if(S.db){try{await S.db.collection(coll).doc(id).delete();}catch(e){console.warn("db del",e);}}
}
async function connect(){
  try{
    const [db,user,sample,assets]=await Promise.all([claude.use("db"),claude.use("user"),claude.use("sample"),claude.use("assets")]);
    S.sample=sample; S.assets=assets;
    if(!db){render();return;}
    const uid=user?await user.id():null;
    if(!uid){render();return;}
    S.uid=uid;S.user=user;S.dbRaw=db;S.isCoach=!!((await user.canEdit())||(await user.isOwner()));
    const base="members/"+uid+"/";
    S.db={collection:c=>db.collection(base+c)};S.online=true;
    db.doc("members/"+uid).set({lastSeen:Date.now()}).catch(()=>{});
    for(const coll of COLLS){
      S.db.collection(coll).onSnapshot(snap=>{
        const o={};snap.docs.forEach(d=>{o[d.id]=d.data();});
        if(coll==="settings"){ if(o.main) S.settings={...DEFAULT_SETTINGS,...o.main}; }
        else S[coll]=o;
        saveCache();render();
      },e=>console.warn("snapshot",coll,e));
    }
  }catch(e){console.warn("connect",e);}
  render();
}

// ---------- derived ----------
const dayDoc=d=>S.days[d]||{meals:[]};
const dayTotals=d=>{const m=dayDoc(d).meals||[];return{cal:sum(m,x=>x.cal),p:sum(m,x=>x.p),c:sum(m,x=>x.c),f:sum(m,x=>x.f)};};
const workoutsSorted=()=>Object.entries(S.workouts).map(([id,w])=>({id,...w})).sort((a,b)=>(b.date+(b.end||"")).localeCompare(a.date+(a.end||"")));
const bodySorted=()=>Object.entries(S.body).map(([date,b])=>({date,...b})).sort((a,b)=>a.date.localeCompare(b.date));
const volOf=ex=>sum(ex.sets||[],s=>s.done?(+s.reps||0)*(+s.kg||0):0);
const epley=(kg,reps)=>reps>1?kg*(1+reps/30):kg;
function streak(){let n=0,d=ymd();const has=x=>Object.values(S.workouts).some(w=>w.date===x);if(!has(d)){d=addDays(d,-1);if(!has(d))return 0;}while(has(d)){n++;d=addDays(d,-1);}return n;}
function lastSetsFor(name){const ws=workoutsSorted();for(const w of ws){if(S.active&&w.id===S.active.id)continue;const ex=(w.exercises||[]).find(e=>e.name===name);if(ex&&ex.sets&&ex.sets.some(s=>s.done))return ex.sets;}return null;}
function prs(){const out={};for(const w of Object.values(S.workouts))for(const ex of w.exercises||[])for(const s of ex.sets||[]){if(!s.done||!(+s.kg))continue;const e=epley(+s.kg,+s.reps||1);const cur=out[ex.name];if(!cur||e>cur.e1)out[ex.name]={kg:+s.kg,reps:+s.reps||1,e1:e,date:w.date};}return Object.entries(out).map(([name,v])=>({name,...v})).sort((a,b)=>b.e1-a.e1);}

// ---------- render ----------

// ---------- local gyms ----------
const GYMS=[

      const p=j.product,n=p.nutriments||{},nm=(p.product_name||"Product")+(p.brands?" ("+p.brands.split(",")[0]+")":""),L=[];

    try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});vid.srcObject=stream;vid.style.display="block";await vid.play();

function statsBase(){

  const volRows=Object.entries(vol).sort((a,b)=>b[1]-a[1]);const maxV=Math.max(1,...volRows.map(x=>x[1]));

function lineChart(vals,labels,unit){
  const W=360,H=160,pl=36,pr=10,pt=12,pb=26;const lo=Math.floor(Math.min(...vals)-1),hi=Math.ceil(Math.max(...vals)+1);
  const x=i=>pl+(W-pl-pr)*(vals.length===1?0.5:i/(vals.length-1)),y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo||1));
  const ticks=[lo,(lo+hi)/2,hi];const pts=vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`);
  const area=`M${pts[0]} L${pts.join(" L")} L${x(vals.length-1).toFixed(1)},${(H-pb).toFixed(1)} L${x(0).toFixed(1)},${(H-pb).toFixed(1)} Z`;
  const lab=i=>parseYmd(labels[i]).toLocaleDateString("en-GB",{day:"numeric",month:"short"});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight trend">${ticks.map(t=>`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}"/><text x="${pl-6}" y="${y(t)+4}" text-anchor="end">${r1(t)}</text>`).join("")}<path class="area" d="${area}"/><polyline class="line" points="${pts.join(" ")}"/><circle class="dot" cx="${x(vals.length-1)}" cy="${y(vals[vals.length-1])}" r="4"/><text x="${pl}" y="${H-8}">${lab(0)}</text><text x="${W-pr}" y="${H-8}" text-anchor="end">${lab(vals.length-1)}</text><text x="${x(vals.length-1)}" y="${y(vals[vals.length-1])-9}" text-anchor="end" style="fill:var(--fg);font-weight:600">${r1(vals[vals.length-1])} ${unit}</text></svg>`;
}
function barChart(vals,labels,target){
  const W=360,H=150,pl=36,pr=10,pt=12,pb=22;const hi=Math.max(target*1.15,...vals,100);const y=v=>pt+(H-pt-pb)*(1-v/hi);const n=vals.length,bw=(W-pl-pr)/n;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Calories per day">${[0,hi/2,hi].map(t=>`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}"/><text x="${pl-6}" y="${y(t)+4}" text-anchor="end">${r0(t)}</text>`).join("")}${vals.map((v,i)=>`<rect class="bar ${v?"":"dim"}" x="${pl+i*bw+bw*.2}" y="${y(v||0)}" width="${bw*.6}" height="${Math.max(v?2:2,(H-pb)-y(v||0))}" rx="3"/><text x="${pl+i*bw+bw/2}" y="${H-6}" text-anchor="middle">${labels[i]}</text>`).join("")}<line class="target" x1="${pl}" x2="${W-pr}" y1="${y(target)}" y2="${y(target)}"/><text x="${W-pr}" y="${y(target)-4}" text-anchor="end">target ${target}</text></svg>`;
}

document.body.addEventListener("click",async e=>{

    case "toggleSet":{const s=S.active.exercises[+ds.ei].sets[+ds.si];s.done=!s.done;if(s.done){if(!s.reps&&!s.kg){const prev=lastSetsFor(S.active.exercises[+ds.ei].name);if(prev&&prev[+ds.si]){s.kg=prev[+ds.si].kg;s.reps=prev[+ds.si].reps;}}startRest(+S.settings.restSec||90);}LS("active",S.active);render();break;}

    case "rmEx":S.active.exercises.splice(+ds.ei,1);LS("active",S.active);render();break;
    case "addEx":exSheet(null);break;
    case "restAdd":if(S.rest){S.rest.end+=30000;S.rest.tot=(S.rest.tot||0)+30000;renderRest();}break;
    case "restSkip":S.rest=null;renderRest();break;
    case "discard":openSheet(`<h2>Discard this workout?</h2><div class="muted">Nothing from it will be saved.</div><div class="grid2"><button class="btn" id="dNo">Keep going</button><button class="btn danger" id="dYes">Discard</button></div>`);$("#dNo").onclick=closeSheet;$("#dYes").onclick=()=>{S.active=null;S.rest=null;LS("active",null);closeSheet();render();};break;
    case "finish":{const a=S.active;const w={type:a.type,name:a.name,day:a.day||null,date:a.date,start:a.start,end:Date.now(),duration:a.duration!=null&&a.duration!==""?+a.duration:Math.round((Date.now()-a.start)/60000),distance:a.distance?+a.distance:null,style:a.style||null,rpe:a.rpe?+a.rpe:null,notes:a.notes||"",exercises:(a.exercises||[]).map(x=>({name:x.name,muscle:x.muscle||muscleOf(x.name),rpe:x.rpe?+x.rpe:null,sets:x.sets.map(s=>({kg:+s.kg||0,reps:+s.reps||0,rpe:s.rpe?+s.rpe:null,done:!!s.done}))}))};S.active=null;S.rest=null;LS("active",null);const pb=prBest();await save("workouts",a.id,w);toast("Workout saved");postWorkout(w,pb);S.trainView="history";render();break;}
    case "delWorkout":await remove("workouts",ds.id);render();break;
    case "fdate":S.foodDate=addDays(S.foodDate,+ds.n);render();break;
    case "addFood":foodSheet(ds.meal);break;
    case "delFood":{const doc={...dayDoc(S.foodDate)};doc.meals=(doc.meals||[]).filter(x=>x.id!==ds.id);await save("days",S.foodDate,doc);render();break;}
    case "targets":targetsSheet();break;
    case "saveBody":saveBody();break;
    case "quickWeight":{const v=+$("#qW").value;if(!v){toast("Enter a weight");break;}const d=ymd();await save("body",d,{...(S.body[d]||{}),weight:v});toast("Weight logged");render();break;}
    case "repeatLast":{const last=workoutsSorted().find(w=>w.type==="gym"&&(w.exercises||[]).length);if(!last)break;startWorkout({type:"gym",name:last.name,exercises:last.exercises.map(x=>({name:x.name,muscle:x.muscle,sets:x.sets.map(s=>({kg:s.kg||"",reps:s.reps||"",done:false}))}))});break;}
    case "copyYesterday":{const y=dayDoc(addDays(S.foodDate,-1)).meals||[];if(!y.length){toast("Nothing logged yesterday");break;}const doc={...dayDoc(S.foodDate)};doc.meals=[...(doc.meals||[]),...y.map(m=>({...m,id:uid(),t:Date.now()}))];await save("days",S.foodDate,doc);toast("Copied yesterday's meals");render();break;}
    case "delBody":await remove("body",ds.id);render();break;
  }
});
document.body.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.exrpe!==undefined&&S.active){S.active.exercises[+t.dataset.exrpe].rpe=t.value;LS("active",S.active);}
  else if(t.dataset.set&&S.active){S.active.exercises[+t.dataset.ei].sets[+t.dataset.si][t.dataset.set]=t.value;LS("active",S.active);}
  else if(t.dataset.bind&&S.active){S.active[t.dataset.bind]=t.value;LS("active",S.active);}
  else if(t.dataset.act==="restSec"){S.settings.restSec=+t.value||90;saveCache();}
});
document.body.addEventListener("change",e=>{if(e.target.dataset.act==="restSec")save("settings","main",{...S.settings,restSec:+e.target.value||90});});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();});

render();
if(window.claude&&claude.use)connect();
})();
</script>

</body></html>
